name: premarket-list
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  manage:
    # Only the repo owner can change the list; titles must start with "premarket ".
    if: github.event.issue.user.login == 'traderkr' && startsWith(github.event.issue.title, 'premarket ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q yfinance
      - name: Update list
        id: pm
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python3 .github/scripts/pm_manage.py
      - name: Refresh and commit
        if: steps.pm.outputs.changed == 'true'
        env:
          FORCE: '1'
        run: |
          python3 refresh.py
          git config user.name "github-actions[bot]"
          git config user.email "41898201+github-actions[bot]@users.noreply.github.com"
          git add premarket.json data.json index.html
          git commit -m "Pre-market list: ${{ steps.pm.outputs.changed == 'true' && 'update' || '' }} (#${{ github.event.issue.number }})"
          git pull --rebase -q origin main && git push -q origin main
      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.pm.outputs.msg }}
        run: |
          gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} --body "$MSG"
          gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }}

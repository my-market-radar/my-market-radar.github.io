name: live
on:
  schedule:
    - cron: '*/5 8-21 * * 1-5'   # covers 4:00 AM-4:10 PM ET in EDT and EST; refresh.py gates on ET hours
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass market-hours check'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [template.html, refresh.py, sitecrypt.py, static.enc.json, premarket.enc.json, summaries.enc.json, .github/workflows/live.yml]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.refresh.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q yfinance cryptography
      - name: Refresh and build encrypted site
        id: refresh
        env:
          # Pushes (template, summaries, list changes) rebuild even outside market hours.
          FORCE: ${{ (github.event_name == 'push' || inputs.force) && '1' || '0' }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          POSITIONS_JSON: ${{ secrets.POSITIONS_JSON }}
        run: |
          python3 refresh.py
          if [ -f _site/index.html ]; then echo "built=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.refresh.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

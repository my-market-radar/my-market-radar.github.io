name: summaries
on:
  schedule:
    # ~9:45 AM, 12:30 PM, 4:15 PM ET (pairs cover EDT and EST; the 3h freshness check drops the duplicate)
    - cron: '45 13,14 * * 1-5'
    - cron: '30 16,17 * * 1-5'
    - cron: '15 20,21 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate even if summary is < 3h old'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Summarize
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python3 summarize.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898201+github-actions[bot]@users.noreply.github.com"
          git add summaries.json data.json index.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "AI summaries $(TZ=America/New_York date '+%F %H:%M %Z')"
          git pull --rebase -q origin main && git push -q origin main

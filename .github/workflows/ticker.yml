name: ticker
on:
  workflow_dispatch:
    inputs:
      op: { description: 'add or remove', type: choice, options: [add, remove], required: true }
      list: { description: 'premarket or watchlist', type: choice, options: [premarket, watchlist], required: true }
      ticker: { description: 'Ticker symbol, e.g. TSLA', type: string, required: true }
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: live          # shared with live.yml so builds/commits never overlap
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q yfinance cryptography
      - name: Apply ticker operation
        env:
          OP: ${{ inputs.op }}
          LIST: ${{ inputs.list }}
          TICKER: ${{ inputs.ticker }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: python3 .github/scripts/ticker_op.py
      - name: Commit encrypted config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898201+github-actions[bot]@users.noreply.github.com"
          git add premarket.enc.json static.enc.json lastop.enc.json
          git commit -qm "Ticker ${{ inputs.op }} (${{ inputs.list }})" || true
          git pull -q --rebase origin main && git push -q origin main
      - name: Refresh and build encrypted site
        env:
          FORCE: '1'
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          POSITIONS_JSON: ${{ secrets.POSITIONS_JSON }}
        run: python3 refresh.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

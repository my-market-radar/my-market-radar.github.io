<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Market Radar</title><style>
:root{--blue:#2f6bff;--cyan:#12c2d6;--gold:#f2b705;--up:#16a34a;--dn:#dc2626;--amb:#f59e0b;--bg:#f5f7fb;--card:#fff;--tx:#1a2233;--mut:#6b7385}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:1240px;margin:auto;padding:20px}
.hero{border-radius:18px;padding:24px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--cyan) 55%,var(--gold));display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between}
.hero h1{margin:4px 0;font-size:30px}.kp{display:flex;flex-wrap:wrap;gap:12px}.k{background:rgba(255,255,255,.18);border-radius:12px;padding:10px 16px}.k b{display:block;font-size:20px}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;background:#fff;color:var(--mut)}.st i{width:9px;height:9px;border-radius:50%;background:currentColor}
.st.open{color:var(--up)}.st.open i{animation:p 1.4s infinite}.st.pre,.st.after{color:var(--amb)}@keyframes p{0%{box-shadow:0 0 0 0 rgba(22,163,74,.7)}70%{box-shadow:0 0 0 9px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.card{background:var(--card);border-radius:16px;padding:20px;margin-top:20px;box-shadow:0 2px 10px rgba(20,40,90,.06)}h2{margin:0 0 14px;font-size:19px}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{padding:9px 8px;border-bottom:1px solid #e8ebf2;text-align:right;vertical-align:top}th{color:var(--mut);font-weight:500;white-space:nowrap}td:first-child,th:first-child{text-align:left}
tr.row td:first-child{border-left:5px solid var(--gold)}
tr.ai td{text-align:left;border-bottom:1px solid #e8ebf2;padding:0 8px 12px}.aic{border-radius:12px;padding:12px 14px;background:linear-gradient(120deg,#eef3ff,#e6fbfd 60%,#fff7dd);border:1px solid #dbe4ff}.aic summary{cursor:pointer;font-weight:700;color:var(--blue)}.aic p{margin:8px 0;line-height:1.5;font-size:14px}.cites a{font-size:11.5px;margin-right:8px;text-decoration:none;background:#fff;border-radius:999px;padding:1px 7px;border:1px solid #dbe4ff}.tk{background:var(--gold);color:#fff;border-radius:6px;padding:2px 8px;font-weight:700}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--mut)}.pill{border-radius:6px;padding:1px 6px;white-space:nowrap}.pill.up{background:#e7f7ec}.pill.dn{background:#fdeaea}.pill.fl{background:#eef0f4}
.small{font-size:11.5px;color:var(--mut)}.big{font-size:16px;font-weight:700}
.flash-up{animation:fu 1.6s}.flash-dn{animation:fd 1.6s}@keyframes fu{0%{background:#bbf7d0}100%{background:transparent}}@keyframes fd{0%{background:#fecaca}100%{background:transparent}}
.rng{position:relative;width:110px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--dn),var(--gold),var(--up));margin:6px 0 2px auto}.rng i{position:absolute;top:-4px;width:4px;height:14px;background:var(--tx);border-radius:2px}
.gold{border-left:6px solid var(--gold);background:#fff9e6}
.bar{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}.bar span{width:200px}.bar .t{flex:1;min-width:120px;height:18px;background:#eef0f4;border-radius:9px}.bar .t i{display:block;height:100%;border-radius:9px}
.news{display:flex;gap:10px;margin:10px 0}.tag{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;height:fit-content}.bull{background:#e7f7ec;color:var(--up)}.bear{background:#fdeaea;color:var(--dn)}.neutral{background:#eef0f4;color:var(--mut)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}dt{color:var(--mut)}dd{margin:0}a{color:var(--blue)}
@media(max-width:820px){tr.ai{border:0;margin:-12px 0 12px}tr.ai td::before{content:none}tr.ai td{display:block}thead{display:none}table,tbody,tr,td{display:block;width:100%}tr.row{border:1px solid #e8ebf2;border-left:5px solid var(--gold);border-radius:12px;margin-bottom:12px;padding:6px}tr.row td:first-child{border-left:0}
td{display:flex;justify-content:space-between;gap:12px;text-align:right;border-bottom:1px dashed #eef0f4}td::before{content:attr(data-l);color:var(--mut);font-weight:500;text-align:left}.rng{margin-left:auto}dl{grid-template-columns:1fr}}
</style></head><body><div class="wrap" id="app"></div><script>
let DATA=/*DATA*/null,prev={},next=60;
const $=n=>n==null?'—':'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const cls=v=>v>0?'up':v<0?'dn':'fl',sg=v=>(v>0?'+':'')+v.toFixed(2);
function mkt(){const t=new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'})),d=t.getDay(),m=t.getHours()*60+t.getMinutes();
 if(d==0||d==6)return['closed','Closed'];if(m>=570&&m<960)return['open','LIVE • Market Open'];if(m>=240&&m<570)return['pre','Pre-market'];if(m>=960&&m<1200)return['after','After-hours'];return['closed','Closed']}
function spark(a,up){if(!a||a.length<2)return'';const w=110,h=30,mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1;
 return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline fill="none" stroke="${up?'#16a34a':'#dc2626'}" stroke-width="1.6" points="${a.map((v,i)=>`${(i/(a.length-1)*w).toFixed(1)},${(h-2-(v-mn)/r*(h-4)).toFixed(1)}`).join(' ')}"/></svg>`}
function render(d){const R=d.rows,tv=R.reduce((a,r)=>a+r.value,0),tc=R.reduce((a,r)=>a+r.entry_price*r.units,0),tp=tv-tc,pct=tc?tp/tc*100:0,[mc,ml]=mkt();
const ma=(r,k,l)=>`<span class="${r.price>=r[k]?'up':'dn'}">${l} ${r[k].toFixed(2)}${r.price>=r[k]?'▲':'▼'}</span>`;
let h=`<div class="hero"><div><span class="st ${mc}"><i></i>${ml}</span><h1>My Market Radar</h1><div>Watchlist · ${R.length} ticker${R.length>1?'s':''}</div>
<div class="small" style="color:#fff">Last updated ${d.updated} · <span id="cd">refreshing in ${next}s</span></div></div>
<div class="kp"><div class="k">Total value<b>${$(tv)}</b></div><div class="k">Total P/L<b>${tp<0?'-':'+'}${$(Math.abs(tp))}</b></div><div class="k">Total return<b>${sg(pct)}%</b></div></div></div>
<div class="card"><h2>Watchlist</h2><table><thead><tr><th>Ticker</th><th>Intraday</th><th>Current / Day</th><th>Entry</th><th>Return · P/L</th><th>Units · Value</th><th>52w range</th><th>Technicals</th><th>Analysts</th></tr></thead><tbody>`;
for(const r of R){const pos=Math.max(0,Math.min(100,(r.price-r.low52)/(r.high52-r.low52)*100)),a=r.analyst,ch=prev[r.ticker]!=null&&prev[r.ticker]!==r.price?(r.price>prev[r.ticker]?'flash-up':'flash-dn'):'';
h+=`<tr class="row"><td data-l="Ticker"><div><span class="tk">${r.ticker}</span><div class="small" style="margin-top:4px">${r.name}</div></div></td>
<td data-l="Intraday">${spark(r.spark,r.day_chg>=0)}</td>
<td data-l="Current / Day" class="${ch}"><div><span class="big">${$(r.price)}</span><br><span class="pill ${cls(r.day_chg)}">${sg(r.day_chg)} (${sg(r.day_pct)}%)</span>
<div class="small">H ${$(r.day_high)} L ${$(r.day_low)}<br>Vol ${r.volume?r.volume.toLocaleString():'—'}<br>${r.quote_time||r.price_date}</div></div></td>
<td data-l="Entry"><div>${$(r.entry_price)}<div class="small">${r.date_added}</div></div></td>
<td data-l="Return · P/L"><div><span class="pill ${cls(r.ret_pct)}">${sg(r.ret_pct)}%</span><br><span class="${cls(r.pl)}">${r.pl<0?'-':''}${$(Math.abs(r.pl))}</span></div></td>
<td data-l="Units · Value"><div>${r.units}<br>${$(r.value)}</div></td>
<td data-l="52w range"><div>${$(r.low52)} – ${$(r.high52)}<div class="rng"><i style="left:${pos}%"></i></div><div class="small">${pos.toFixed(0)}% of range</div></div></td>
<td data-l="Technicals"><div class="small" style="font-size:12px">${ma(r,'sma20','20d')}<br>${ma(r,'sma50','50d')}<br>${ma(r,'sma200','200d')}<br><b>RSI ${r.rsi14}</b></div></td>
<td data-l="Analysts"><div>${a?`<b class="up">${a.rating}</b><div class="small">${a.analysts} analysts<br>${a.breakdown}</div>PT ${$(a.target)} <span class="${cls(a.target-r.price)}">${sg((a.target/r.price-1)*100).replace(/(\.\d)\d$/,'$1')}%</span><div class="small"><a href="${a.url}">${a.source.split(' ')[0]}</a> ${a.as_of}</div>`:'N/A'}</div></td></tr>`;prev[r.ticker]=r.price;if(r.ai&&r.ai.text){const s=r.ai;h+=`<tr class="ai"><td colspan="9"><details class="aic" open><summary>✨ AI Insight (Perplexity) · ${r.ticker} <span class="small" style="font-weight:400">generated ${s.generated}</span></summary><p>${s.text.replace(/</g,'&lt;')}</p><div class="cites">${(s.citations||[]).map((u,i)=>`<a href="${u}" target="_blank" rel="noopener">[${i+1}] ${new URL(u).hostname.replace('www.','')}</a>`).join('')}</div><div class="small" style="margin-top:6px">AI-generated summary. It may contain errors and is not investment advice.</div></details></td></tr>`}}
h+=`</tbody></table><p class="small">${d.note}</p></div>`;const g=d.gdx_detail;
if(g){const pal=['var(--gold)','var(--blue)','var(--cyan)'],mx=Math.max(...g.holdings.map(x=>x[1]));
h+=`<div class="card gold"><h2>GDX detail · gold miners</h2><dl>${g.gold.map(x=>`<dt>${x[0]}</dt><dd>${x[1]}</dd>`).join('')}</dl></div>
<div class="card"><h2>Top holdings</h2>${g.holdings.map((x,i)=>`<div class="bar"><span>${x[0]}</span><div class="t"><i style="width:${x[1]/mx*100}%;background:${pal[i%3]}"></i></div><b>${x[1].toFixed(2)}%</b></div>`).join('')}<p class="small">Share of fund assets, via stockanalysis.com</p></div>
<div class="card"><h2>What drove this week</h2>${g.news.map(x=>`<div class="news"><span class="tag ${x[0]}">${{bull:'Bullish',bear:'Bearish',neutral:'Mixed'}[x[0]]}</span><div>${x[1]}</div></div>`).join('')}
<h2 style="margin-top:18px">Sources</h2><ul>${g.sources.map(x=>`<li><a href="${x[1]}">${x[0]}</a></li>`).join('')}</ul></div>`}
document.getElementById('app').innerHTML=h}
async function poll(){try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(r.ok){DATA=await r.json();}}catch(e){}render(DATA);next=60}
setInterval(()=>{next--;if(next<=0)poll();const c=document.getElementById('cd');if(c)c.textContent='refreshing in '+next+'s'},1000);
if(DATA)render(DATA);poll();
</script></body></html>
